services:
  - type: web
    name: gym-management-api
    env: node
    plan: free
    region: oregon
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    healthCheckPath: "/api/health"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gym-management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://gymapplicationbymalik.vercel.app"
      - key: CORS_ORIGIN
        value: "https://gymapplicationbymalik.vercel.app,http://localhost:3000,http://localhost:5173"
      - key: BREVO_SMTP_HOST
        value: "smtp-relay.brevo.com"
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM_EMAIL
        value: "noreply@titanforgegym.com"
      - key: MAIL_FROM_NAME
        value: "TitanForge Fitness & Gym"

databases:
  - name: gym-management-db
    plan: free
    region: oregon
    databaseName: gym_management
    user: gym_admin
