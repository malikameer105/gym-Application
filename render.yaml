services:
  - type: web
    name: gym-management-api
    env: node
    plan: free
    region: oregon
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    healthCheckPath: "/api/health"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gym-management-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://your-app.vercel.app,http://localhost:5173"
      - key: SMTP_HOST
        value: "smtp-relay.brevo.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "noreply@titanforgegym.com"
      - key: SMTP_FROM_NAME
        value: "TitanForge Fitness"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: gym-management-db
    plan: free
    region: oregon
    databaseName: gym_management
    user: gym_admin
